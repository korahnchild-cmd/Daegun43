<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>대건고 정기모임 관리 (1·2차 통합)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Noto Sans KR', sans-serif;
        }
        body {
            background: #f0f4f8;
            margin: 0;
            padding: 20px 12px;
            color: #1e2a3a;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            padding: 18px 20px 28px;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin: 0 0 4px;
            background: linear-gradient(135deg, #1f5e3a, #2b7a4b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub {
            color: #4a627a;
            border-left: 4px solid #2b7a4b;
            padding-left: 14px;
            margin: 6px 0 20px;
            font-size: 0.9rem;
        }
        /* 모임 선택 및 제어 */
        .control-panel {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-end;
            border: 1px solid #e2edf2;
        }
        .meeting-section {
            flex: 3;
            min-width: 200px;
        }
        .fee-section {
            flex: 1;
            min-width: 140px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        /* 모임 장소/식대 정보 */
        .meeting-info {
            background: #fefce8;
            border-radius: 20px;
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 1px solid #f0e6b2;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
        }
        .info-item {
            flex: 1;
            min-width: 140px;
        }
        .info-item label {
            font-weight: 700;
            font-size: 0.7rem;
            display: block;
            margin-bottom: 4px;
            color: #8a6e2d;
        }
        .info-item input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 16px;
            border: 1px solid #e2d6a4;
            background: white;
            font-size: 0.85rem;
        }
        label {
            font-weight: 600;
            font-size: 0.75rem;
            display: block;
            margin-bottom: 5px;
            color: #2c5a6e;
        }
        select, input {
            background: white;
            border: 1px solid #cbdde6;
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 0.85rem;
            width: 100%;
        }
        button {
            background: white;
            border: 1px solid #cbdde6;
            border-radius: 40px;
            padding: 7px 16px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button.primary {
            background: #2b7a4b;
            border-color: #2b7a4b;
            color: white;
        }
        button.primary:hover { background: #1f5e3a; }
        button.danger { color: #b91c1c; border-color: #f3cfcf; }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #eef5f0;
            border-radius: 28px;
            padding: 12px 20px;
            margin-bottom: 22px;
            justify-content: space-between;
        }
        .stat-card {
            background: white;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: 500;
            font-size: 0.8rem;
        }
        .stat-card span {
            font-size: 1.2rem;
            font-weight: 800;
            margin-right: 5px;
            color: #1f5e3a;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e2edf2;
            margin-top: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 720px;
        }
        th {
            background: #f1f9f4;
            padding: 12px 6px;
            font-weight: 700;
            color: #1f4e3a;
            border-bottom: 2px solid #cbe5da;
        }
        td {
            padding: 10px 6px;
            border-bottom: 1px solid #e9edf2;
            vertical-align: middle;
        }
        .member-name {
            font-weight: 700;
            color: #0f2c38;
        }
        .phone {
            font-family: monospace;
            font-size: 0.75rem;
            color: #5c6f87;
        }
        .checkbox-cell {
            text-align: center;
            width: 55px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2b7a4b;
        }
        .etc-input {
            width: 120px;
            padding: 5px 8px;
            border-radius: 20px;
            border: 1px solid #d4e0e8;
            font-size: 0.75rem;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 8px;
        }
        .footer-note {
            margin-top: 24px;
            text-align: right;
            font-size: 0.7rem;
            color: #7f96aa;
            border-top: 1px solid #e2edf2;
            padding-top: 16px;
        }
        @media (max-width: 640px) {
            .container { padding: 14px; }
            .info-item { min-width: 100%; }
            .etc-input { width: 90px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏆 대건고 43회 정기모임</h1>
    <div class="sub">✔️ 1차 / 2차 참석 · 회비 납부 · 장소 및 식대 기록</div>

    <!-- 모임 선택 컨트롤 -->
    <div class="control-panel">
        <div class="meeting-section">
            <label>📅 모임 선택</label>
            <div style="display: flex; gap: 6px;">
                <select id="meetingSelect" style="flex:2"></select>
                <button id="loadMeetingBtn" class="primary">불러오기</button>
                <button id="saveMeetingBtn" class="primary">💾 저장</button>
            </div>
        </div>
        <div class="fee-section">
            <label>💰 1인 회비 (KRW)</label>
            <input type="number" id="feeAmountInput" step="1000" value="30000">
        </div>
        <div class="btn-group">
            <button id="newMeetingBtn">➕ 새 모임</button>
            <button id="deleteMeetingBtn" class="danger">🗑️ 삭제</button>
            <button id="copyPrevBtn">📋 이전 모임 복사</button>
        </div>
    </div>

    <!-- 모임 장소 및 식대 정보 (모임별 저장) -->
    <div class="meeting-info" id="meetingInfoArea">
        <div class="info-item">
            <label>🍽️ 1차 모임 장소</label>
            <input type="text" id="place1" placeholder="예: 대구 수성구 OO식당">
        </div>
        <div class="info-item">
            <label>💰 1차 식대 합계 (KRW)</label>
            <input type="number" id="mealCost1" step="10000" placeholder="0">
        </div>
        <div class="info-item">
            <label>🥂 2차 모임 장소</label>
            <input type="text" id="place2" placeholder="예: 대구 중구 OO바">
        </div>
        <div class="info-item">
            <label>💰 2차 식대 합계 (KRW)</label>
            <input type="number" id="mealCost2" step="10000" placeholder="0">
        </div>
    </div>

    <!-- 통계 요약 -->
    <div class="stats">
        <div class="stat-card">👥 1차 참석: <span id="attend1Count">0</span></div>
        <div class="stat-card">🥂 2차 참석: <span id="attend2Count">0</span></div>
        <div class="stat-card">💰 회비 납부: <span id="paidCount">0</span> 명</div>
        <div class="stat-card">🏦 총 회비: <span id="totalFeeSum">0</span> 원</div>
        <div class="stat-card">📋 전체 회원: <span id="totalMemberCount">53</span></div>
        <div class="stat-card">🍽️ 1차 식대: <span id="displayMeal1">0</span> 원</div>
        <div class="stat-card">🥂 2차 식대: <span id="displayMeal2">0</span> 원</div>
    </div>

    <!-- 일괄 동작 버튼 -->
    <div class="action-buttons">
        <button id="markAllAttend1Btn">✅ 전체 1차 참석</button>
        <button id="clearAllAttend1Btn">⬜ 1차 전체 해제</button>
        <button id="markAllAttend2Btn">✅ 전체 2차 참석</button>
        <button id="clearAllAttend2Btn">⬜ 2차 전체 해제</button>
        <button id="markAllPaidBtn">💰 전체 회비 납부</button>
        <button id="clearAllPaidBtn">❌ 회비 미납</button>
        <button id="exportCSVBtn">📎 CSV 내보내기</button>
    </div>

    <!-- 회원 테이블 (연락포함, 2차 참석은 기타메모 우측) -->
    <div class="table-wrapper">
        <table id="memberTable">
            <thead>
                <tr><th>#</th><th>이름</th><th>연락처</th><th>1차 참석</th><th>회비 납부</th><th>기타 메모</th><th>2차 참석</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="footer-note">
        ✅ 모든 데이터는 브라우저(localStorage)에 저장 | 모임별 1·2차 장소·식대 기록 가능
    </div>
</div>

<script>
    // ---------- 정회원 명단 (연락처 포함) ----------
    const MEMBERS_RAW = [
        {no:1, name:"공태영", phone:"010-4242-0731"},{no:2, name:"권대원", phone:"010-6525-7334"},{no:3, name:"김대훈", phone:"010-8824-7747"},{no:4, name:"김상현", phone:"010-2905-5652"},{no:5, name:"김상훈", phone:"010-4875-4267"},
        {no:6, name:"김성웅", phone:"010-4095-0787"},{no:7, name:"김성훈", phone:"010-7753-5995"},{no:8, name:"김용식", phone:"010-3818-5376"},{no:9, name:"김윤철", phone:"010-3512-7048"},{no:10, name:"김주태", phone:"010-4141-6837"},
        {no:11, name:"김진해", phone:"010-3804-8477"},{no:12, name:"김태하", phone:"010-6528-3121"},{no:13, name:"김태훈", phone:"010-3253-0224"},{no:14, name:"김학동", phone:"010-4514-8754"},{no:15, name:"노영중", phone:"010-7222-7518"},
        {no:16, name:"노태기", phone:"010-5531-0373"},{no:17, name:"류형종", phone:""},{no:18, name:"박근호", phone:"010-2529-0352"},{no:19, name:"박정휘", phone:"010-2653-4160"},{no:20, name:"박진욱", phone:"010-4524-2644"},
        {no:21, name:"박효진", phone:"010-3907-4311"},{no:22, name:"배종섭", phone:"010-8948-6589"},{no:23, name:"배한용", phone:"010-8568-3156"},{no:24, name:"서준석", phone:"010-8583-7956"},{no:25, name:"석상용", phone:"010-2443-7434"},
        {no:26, name:"소재환", phone:"010-3300-3893"},{no:27, name:"양기주", phone:"010-7272-3892"},{no:28, name:"유창우", phone:"010-9522-6362"},{no:29, name:"윤용원", phone:"010-3334-3714"},{no:30, name:"윤준호", phone:"010-8609-7154"},
        {no:31, name:"윤희삼", phone:"010-3095-7596"},{no:32, name:"이광희", phone:"010-8332-0020"},{no:33, name:"이병주", phone:"010-4515-2544"},{no:34, name:"이상찬", phone:"010-4523-3694"},{no:35, name:"이영찬", phone:"010-5183-2005"},
        {no:36, name:"이정섭", phone:"010-9309-9802"},{no:37, name:"이종경", phone:"010-2922-1783"},{no:38, name:"장정훈", phone:"010-3495-3792"},{no:39, name:"전상규", phone:"010-5166-1132"},{no:40, name:"전익성", phone:"010-2816-1193"},
        {no:41, name:"전해석", phone:"010-5144-1144"},{no:42, name:"전 헌", phone:"010-4431-5153"},{no:43, name:"정일영", phone:"010-9181-5102"},{no:44, name:"정창훈", phone:"010-6590-5544"},{no:45, name:"정호직", phone:"010-3454-9631"},
        {no:46, name:"조성헌", phone:"010-3652-7620"},{no:47, name:"지남고", phone:"010-4599-4479"},{no:48, name:"채재윤", phone:"010-2550-2315"},{no:49, name:"최민수", phone:"010-7942-7585"},{no:50, name:"최정해", phone:"010-4906-8309"},
        {no:51, name:"최혁만", phone:"010-3810-1015"},{no:52, name:"홍진찬", phone:"010-7535-2301"},{no:53, name:"황윤기", phone:"010-4531-3178"}
    ];
    const members = MEMBERS_RAW.map(m => ({ id: m.no, name: m.name, phone: m.phone || "없음" }));

    // 데이터 구조: 각 모임 { id, name, feeAmount, place1, mealCost1, place2, mealCost2, membersStatus: [{ attend1, feePaid, etc, attend2 }] }
    let meetings = [];
    let currentMeetingId = null;
    let currentMeetingObj = null;

    function generateEmptyStatus() {
        return members.map(() => ({ attend1: false, feePaid: false, etc: "", attend2: false }));
    }

    const STORAGE_KEY = "Daegeon_Meeting_Manager_V3";

    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(meetings));
    }

    // 마이그레이션 (이전 버전 호환)
    function migrateV2toV3(oldData) {
        if (!Array.isArray(oldData)) return null;
        return oldData.map(meet => {
            const oldStatus = meet.membersStatus || [];
            const newStatus = members.map((_, idx) => {
                const old = oldStatus[idx] || {};
                return {
                    attend1: !!old.attend1,
                    attend2: !!old.attend2,
                    feePaid: !!old.feePaid,
                    etc: old.etc || ""
                };
            });
            return {
                id: meet.id,
                name: meet.name,
                feeAmount: meet.feeAmount || 30000,
                place1: meet.place1 || "",
                mealCost1: meet.mealCost1 || 0,
                place2: meet.place2 || "",
                mealCost2: meet.mealCost2 || 0,
                membersStatus: newStatus
            };
        });
    }

    function loadFromLocalStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length && parsed[0].membersStatus && 'attend1' in parsed[0].membersStatus[0]) {
                    meetings = parsed;
                } else {
                    meetings = migrateV2toV3(parsed) || getDefaultMeetings();
                }
            } catch(e) { meetings = getDefaultMeetings(); }
        } else {
            // 구버전 키 확인 (V2)
            const oldRaw = localStorage.getItem("Daegeon_Meeting_Manager_V2");
            if (oldRaw) {
                const oldData = JSON.parse(oldRaw);
                meetings = migrateV2toV3(oldData) || getDefaultMeetings();
            } else {
                meetings = getDefaultMeetings();
            }
        }
        // 길이 보정
        meetings.forEach(meet => {
            if (!meet.membersStatus || meet.membersStatus.length !== members.length)
                meet.membersStatus = generateEmptyStatus();
            if (meet.feeAmount === undefined) meet.feeAmount = 30000;
            if (meet.place1 === undefined) meet.place1 = "";
            if (meet.mealCost1 === undefined) meet.mealCost1 = 0;
            if (meet.place2 === undefined) meet.place2 = "";
            if (meet.mealCost2 === undefined) meet.mealCost2 = 0;
        });
        saveToLocalStorage();
    }

    function getDefaultMeetings() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const nextEven = (Math.floor(month/2)*2) + 2;
        let m1 = `${year}년 ${nextEven}월 정기모임`;
        let m2 = `${year}년 ${nextEven+2}월 정기모임`;
        if(nextEven+2 > 12) m2 = `${year+1}년 ${(nextEven+2)-12}월 정기모임`;
        return [
            { id: "meet_1", name: m1, feeAmount: 30000, place1: "", mealCost1: 0, place2: "", mealCost2: 0, membersStatus: generateEmptyStatus() },
            { id: "meet_2", name: m2, feeAmount: 30000, place1: "", mealCost1: 0, place2: "", mealCost2: 0, membersStatus: generateEmptyStatus() }
        ];
    }

    // UI 렌더링 (테이블 + 장소/식대)
    function renderTable() {
        if (!currentMeetingObj) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="7">모임을 선택하세요</td></tr>';
            return;
        }
        const statusList = currentMeetingObj.membersStatus;
        document.getElementById('feeAmountInput').value = currentMeetingObj.feeAmount;
        // 장소/식대 필드 값 설정
        document.getElementById('place1').value = currentMeetingObj.place1 || "";
        document.getElementById('mealCost1').value = currentMeetingObj.mealCost1 || 0;
        document.getElementById('place2').value = currentMeetingObj.place2 || "";
        document.getElementById('mealCost2').value = currentMeetingObj.mealCost2 || 0;
        
        let html = '';
        members.forEach((member, idx) => {
            const st = statusList[idx] || { attend1: false, feePaid: false, etc: "", attend2: false };
            html += `<tr>
                        <td style="text-align:center">${member.id}</td>
                        <td class="member-name">${member.name}</td>
                        <td class="phone">${member.phone}</td>
                        <td class="checkbox-cell"><input type="checkbox" class="attend1-cb" data-idx="${idx}" ${st.attend1 ? 'checked' : ''}></td>
                        <td class="checkbox-cell"><input type="checkbox" class="fee-cb" data-idx="${idx}" ${st.feePaid ? 'checked' : ''}></td>
                        <td><input type="text" class="etc-input" data-idx="${idx}" value="${escapeHtml(st.etc || '')}" placeholder="메모"></td>
                        <td class="checkbox-cell"><input type="checkbox" class="attend2-cb" data-idx="${idx}" ${st.attend2 ? 'checked' : ''}></td>
                      </tr>`;
        });
        document.getElementById('tableBody').innerHTML = html;
        attachTableEvents();
        updateStatistics();
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

    function attachTableEvents() {
        document.querySelectorAll('.attend1-cb').forEach(cb => cb.addEventListener('change', (e) => {
            let idx = parseInt(e.target.dataset.idx);
            if (currentMeetingObj?.membersStatus[idx]) currentMeetingObj.membersStatus[idx].attend1 = e.target.checked;
            updateStatistics();
        }));
        document.querySelectorAll('.attend2-cb').forEach(cb => cb.addEventListener('change', (e) => {
            let idx = parseInt(e.target.dataset.idx);
            if (currentMeetingObj?.membersStatus[idx]) currentMeetingObj.membersStatus[idx].attend2 = e.target.checked;
            updateStatistics();
        }));
        document.querySelectorAll('.fee-cb').forEach(cb => cb.addEventListener('change', (e) => {
            let idx = parseInt(e.target.dataset.idx);
            if (currentMeetingObj?.membersStatus[idx]) currentMeetingObj.membersStatus[idx].feePaid = e.target.checked;
            updateStatistics();
        }));
        document.querySelectorAll('.etc-input').forEach(inp => inp.addEventListener('change', (e) => {
            let idx = parseInt(e.target.dataset.idx);
            if (currentMeetingObj?.membersStatus[idx]) currentMeetingObj.membersStatus[idx].etc = e.target.value;
        }));
    }

    function updateStatistics() {
        if (!currentMeetingObj) return;
        const list = currentMeetingObj.membersStatus;
        const attend1 = list.filter(s=>s.attend1).length;
        const attend2 = list.filter(s=>s.attend2).length;
        const paid = list.filter(s=>s.feePaid).length;
        const feeAmt = currentMeetingObj.feeAmount || 30000;
        const totalFee = paid * feeAmt;
        const meal1 = currentMeetingObj.mealCost1 || 0;
        const meal2 = currentMeetingObj.mealCost2 || 0;
        document.getElementById('attend1Count').innerText = attend1;
        document.getElementById('attend2Count').innerText = attend2;
        document.getElementById('paidCount').innerText = paid;
        document.getElementById('totalFeeSum').innerText = totalFee.toLocaleString();
        document.getElementById('totalMemberCount').innerText = members.length;
        document.getElementById('displayMeal1').innerText = meal1.toLocaleString();
        document.getElementById('displayMeal2').innerText = meal2.toLocaleString();
    }

    function updateMeetingSelect() {
        const select = document.getElementById('meetingSelect');
        select.innerHTML = '';
        meetings.forEach(meet => {
            let option = document.createElement('option');
            option.value = meet.id;
            option.textContent = `${meet.name} (회비 ${meet.feeAmount?.toLocaleString()}원)`;
            if (currentMeetingId === meet.id) option.selected = true;
            select.appendChild(option);
        });
    }

    function loadMeetingById(meetingId) {
        let found = meetings.find(m => m.id === meetingId);
        if (found) {
            currentMeetingId = found.id;
            currentMeetingObj = found;
            renderTable();
            updateMeetingSelect();
        } else if (meetings.length) {
            currentMeetingId = meetings[0].id;
            currentMeetingObj = meetings[0];
            renderTable();
            updateMeetingSelect();
        }
    }

    function syncUIToMeeting() {
        if (!currentMeetingObj) return;
        // 테이블 데이터 동기화
        for (let i=0; i<members.length; i++) {
            let attend1Cb = document.querySelector(`.attend1-cb[data-idx="${i}"]`);
            let attend2Cb = document.querySelector(`.attend2-cb[data-idx="${i}"]`);
            let feeCb = document.querySelector(`.fee-cb[data-idx="${i}"]`);
            let etcInp = document.querySelector(`.etc-input[data-idx="${i}"]`);
            if (attend1Cb) currentMeetingObj.membersStatus[i].attend1 = attend1Cb.checked;
            if (attend2Cb) currentMeetingObj.membersStatus[i].attend2 = attend2Cb.checked;
            if (feeCb) currentMeetingObj.membersStatus[i].feePaid = feeCb.checked;
            if (etcInp) currentMeetingObj.membersStatus[i].etc = etcInp.value;
        }
        // 회비 금액
        let newFee = parseInt(document.getElementById('feeAmountInput').value);
        if (!isNaN(newFee) && newFee>0) currentMeetingObj.feeAmount = newFee;
        // 장소/식대
        currentMeetingObj.place1 = document.getElementById('place1').value;
        currentMeetingObj.mealCost1 = parseInt(document.getElementById('mealCost1').value) || 0;
        currentMeetingObj.place2 = document.getElementById('place2').value;
        currentMeetingObj.mealCost2 = parseInt(document.getElementById('mealCost2').value) || 0;
    }

    function saveCurrentMeeting() {
        if (!currentMeetingObj) { alert("저장할 모임 없음"); return; }
        syncUIToMeeting();
        let idx = meetings.findIndex(m => m.id === currentMeetingObj.id);
        if (idx !== -1) meetings[idx] = currentMeetingObj;
        else meetings.push(currentMeetingObj);
        saveToLocalStorage();
        updateMeetingSelect();
        updateStatistics();
        alert(`"${currentMeetingObj.name}" 저장 완료`);
    }

    function createNewMeeting() {
        let name = prompt("모임 이름", `${new Date().getFullYear()}년 ${new Date().getMonth()+2}월 정기모임`);
        if (!name) name = `새 모임 ${Date.now()}`;
        let fee = parseInt(document.getElementById('feeAmountInput').value) || 30000;
        let newId = "meet_" + Date.now();
        let newMeeting = {
            id: newId, name, feeAmount: fee,
            place1: "", mealCost1: 0, place2: "", mealCost2: 0,
            membersStatus: generateEmptyStatus()
        };
        meetings.push(newMeeting);
        saveToLocalStorage();
        currentMeetingId = newId;
        currentMeetingObj = newMeeting;
        renderTable();
        updateMeetingSelect();
        alert(`생성됨: ${name}`);
    }

    function deleteCurrentMeeting() {
        if (!currentMeetingObj || meetings.length <= 1) { alert("최소 1개 모임 필요"); return; }
        if (confirm(`"${currentMeetingObj.name}" 삭제?`)) {
            meetings = meetings.filter(m => m.id !== currentMeetingObj.id);
            saveToLocalStorage();
            currentMeetingId = meetings[0].id;
            currentMeetingObj = meetings[0];
            renderTable();
            updateMeetingSelect();
        }
    }

    function copyFromPrevious() {
        if (!currentMeetingObj || meetings.length < 2) { alert("이전 모임이 없습니다"); return; }
        let prev = [...meetings].reverse().find(m => m.id !== currentMeetingObj.id);
        if (!prev) return;
        if (confirm(`"${prev.name}" 의 모든 정보(참석/회비/메모/장소/식대)를 현재 모임에 복사하시겠습니까?`)) {
            currentMeetingObj.membersStatus = JSON.parse(JSON.stringify(prev.membersStatus));
            currentMeetingObj.place1 = prev.place1 || "";
            currentMeetingObj.mealCost1 = prev.mealCost1 || 0;
            currentMeetingObj.place2 = prev.place2 || "";
            currentMeetingObj.mealCost2 = prev.mealCost2 || 0;
            renderTable();
            saveCurrentMeeting();
            alert("복사 완료 (자동 저장됨)");
        }
    }

    function markAllAttend1(val) { if(currentMeetingObj) { currentMeetingObj.membersStatus.forEach(s=>s.attend1=val); renderTable(); } }
    function markAllAttend2(val) { if(currentMeetingObj) { currentMeetingObj.membersStatus.forEach(s=>s.attend2=val); renderTable(); } }
    function markAllPaid(val) { if(currentMeetingObj) { currentMeetingObj.membersStatus.forEach(s=>s.feePaid=val); renderTable(); } }

    function exportToCSV() {
        if (!currentMeetingObj) return;
        syncUIToMeeting();
        let rows = [["번호","이름","연락처","1차참석","회비납부","기타메모","2차참석"]];
        members.forEach((m, idx) => {
            let st = currentMeetingObj.membersStatus[idx];
            rows.push([
                m.id, m.name, m.phone,
                st.attend1 ? "참석" : "불참",
                st.feePaid ? "납부" : "미납",
                st.etc || "",
                st.attend2 ? "참석" : "불참"
            ]);
        });
        // 추가로 모임 정보 행 삽입
        rows.push(["","[모임정보]","","","","",""]);
        rows.push(["1차 장소", currentMeetingObj.place1 || "", "1차 식대", currentMeetingObj.mealCost1 || 0, "2차 장소", currentMeetingObj.place2 || "", "2차 식대", currentMeetingObj.mealCost2 || 0]);
        let csv = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
        let blob = new Blob(["\uFEFF" + csv], {type: "text/csv;charset=utf-8;"});
        let link = document.createElement("a");
        let url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `${currentMeetingObj.name}_전체현황.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // 이벤트 등록
    function init() {
        loadFromLocalStorage();
        if (!meetings.length) meetings = getDefaultMeetings();
        currentMeetingId = meetings[0].id;
        currentMeetingObj = meetings[0];
        renderTable();
        updateMeetingSelect();

        document.getElementById('loadMeetingBtn').onclick = () => {
            let selId = document.getElementById('meetingSelect').value;
            let found = meetings.find(m => m.id === selId);
            if (found) { currentMeetingId = found.id; currentMeetingObj = found; renderTable(); updateMeetingSelect(); }
        };
        document.getElementById('saveMeetingBtn').onclick = saveCurrentMeeting;
        document.getElementById('newMeetingBtn').onclick = createNewMeeting;
        document.getElementById('deleteMeetingBtn').onclick = deleteCurrentMeeting;
        document.getElementById('copyPrevBtn').onclick = copyFromPrevious;
        document.getElementById('markAllAttend1Btn').onclick = () => markAllAttend1(true);
        document.getElementById('clearAllAttend1Btn').onclick = () => markAllAttend1(false);
        document.getElementById('markAllAttend2Btn').onclick = () => markAllAttend2(true);
        document.getElementById('clearAllAttend2Btn').onclick = () => markAllAttend2(false);
        document.getElementById('markAllPaidBtn').onclick = () => markAllPaid(true);
        document.getElementById('clearAllPaidBtn').onclick = () => markAllPaid(false);
        document.getElementById('exportCSVBtn').onclick = exportToCSV;
        // 장소/식대 입력 변경시 통계 업데이트 및 자동 저장하지는 않음 (저장버튼 누를때 반영)
        document.getElementById('mealCost1').addEventListener('change', () => { if(currentMeetingObj) updateStatistics(); });
        document.getElementById('mealCost2').addEventListener('change', () => { if(currentMeetingObj) updateStatistics(); });
        document.getElementById('feeAmountInput').addEventListener('change', () => { if(currentMeetingObj) updateStatistics(); });
    }
    init();
</script>
</body>
</html>
