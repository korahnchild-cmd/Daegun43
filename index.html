    <style>

            border: 1px solid #e2edf2;
        }
        .meeting-section {
            flex: 3;
            min-width: 220px;
        }
        .fee-section {
            flex: 1;
            min-width: 160px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        label {
            font-weight: 600;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 6px;
            color: #2c5a6e;
            letter-spacing: -0.2px;
        }
        select, input {
            background: white;
            border: 1px solid #cbdde6;
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 0.9rem;
            width: 100%;
            transition: 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #2b7a4b;
            box-shadow: 0 0 0 3px rgba(43,122,75,0.2);
        }
        button {
            background: white;
            border: 1px solid #cbdde6;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            background: #f9fbfd;
            color: #1f3b4c;
        }
        button.primary {
            background: #2b7a4b;
            border-color: #2b7a4b;
            color: white;
            box-shadow: 0 2px 6px rgba(43,122,75,0.2);
        }
        button.primary:hover {
            background: #1f5e3a;
            transform: translateY(-1px);
        }
        button.danger {
            color: #b91c1c;
            border-color: #f3cfcf;
        }
        button.danger:hover {
            background: #fff0f0;
            border-color: #e0b4b4;
        }
        button:hover {
            background: #eef3f7;
            transform: translateY(-1px);
        }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: #eef5f0;
            border-radius: 28px;
            padding: 14px 24px;
            margin-bottom: 24px;
            align-items: center;
            justify-content: space-between;
        }
        .stat-card {
            background: white;
            border-radius: 40px;
            padding: 8px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            font-weight: 500;
        }
        .stat-card span {
            font-size: 1.5rem;
            font-weight: 800;
            margin-right: 6px;
            color: #1f5e3a;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e2edf2;
            background: white;
            margin-top: 8px;
        }
        table {

            border-collapse: collapse;
            font-size: 0.85rem;

        th {
            background: #f1f9f4;
            padding: 14px 8px;
            font-weight: 700;
            color: #1f4e3a;

            transform: scale(1);
            accent-color: #2b7a4b;

</head>

    <div class="sub">✔️ 참석 · 회비 납부 · 기타사항 기록 | 2달에 한 번 정기모임 자동 집계</div>

            <div style="display: flex; gap: 8px; align-items: center;">
                <select id="meetingSelect" style="flex:2"></select>
                <button id="loadMeetingBtn" class="primary">불러오기</button>
                <button id="saveMeetingBtn" class="primary">💾 현재 모임 저장</button>
            </div>
        </div>
        <div class="fee-section">
            <label>💰 1인 회비 금액 (KRW)</label>
            <input type="number" id="feeAmountInput" step="1000" value="30000" style="width:140px">
        </div>
        <div class="btn-group">
            <button id="newMeetingBtn">➕ 새 모임</button>
            <button id="deleteMeetingBtn" class="danger">🗑️ 삭제</button>
            <button id="copyPrevBtn" title="이전 모임에서 참석/회비 복사">📋 복사</button>
        </div>
    </div>

    <!-- 통계 요약 -->
    <div class="stats" id="statsArea">
        <div class="stat-card">👥 참석 인원: <span id="attendCount">0</span> 명</div>
        <div class="stat-card">💰 회비 납부자: <span id="paidCount">0</span> 명</div>

        <div class="stat-card">📋 전체 회원: <span id="totalMemberCount">53</span> 명</div>
    </div>

    <!-- 편의 버튼 -->
    <div class="action-buttons">
        <button id="markAllAttendBtn">✅ 전체 참석 체크</button>
        <button id="clearAllAttendBtn">⬜ 참석 전체 해제</button>
        <button id="markAllPaidBtn">💰 전체 회비 납부</button>
        <button id="clearAllPaidBtn">❌ 회비 납부 해제</button>
        <button id="exportCSVBtn">📎 엑셀 내보내기 (CSV)</button>
    </div>

    <!-- 회원 테이블 -->
    <div class="table-wrapper">
        <table id="memberTable">
            <thead>
                <tr>
                    <th>#</th><th>이름</th><th>연락처</th><th style="width:70px">참석</th><th style="width:80px">회비 납부</th><th>기타 (메모)</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
        </table>
    </div>
    <div class="footer-note">
        ✅ 데이터는 브라우저에 저장됩니다 (localStorage) | 모임 단위로 참석/회비/기타 기록 보존 | 정회원 명단 53명 (2026 기준)
    </div>
</div>

    const members = MEMBERS_RAW.map(m => ({
        id: m.no,
        name: m.name,
        phone: m.phone || "번호없음",
        displayInfo: m.name
    }));

    // 전역 데이터
    let meetings = [];        // { id, name, feeAmount, membersStatus: [{attendance, feePaid, etc}] }
    let currentMeetingId = null;
    let currentMeetingObj = null;

    // helpers
    function generateEmptyStatus() {
        return members.map(() => ({ attendance: false, feePaid: false, etc: "" }));
    }

    // 저장소 키
    const STORAGE_KEY = "Daegeon_Meeting_Manager";

    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(meetings));
    }

    function loadFromLocalStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) {
            try {
                const parsed = JSON.parse(raw);
                if(Array.isArray(parsed)) {
                    meetings = parsed;
                    // 호환성: 기존 meetings의 membersStatus 길이 검증
                    meetings.forEach(meet => {
                        if(!meet.membersStatus || meet.membersStatus.length !== members.length) {
                            meet.membersStatus = generateEmptyStatus();
                        }
                        if(meet.feeAmount === undefined) meet.feeAmount = 30000;
                    });
                    return;
                }
            } catch(e) {}
        }
        // 기본값: 2개의 예제 모임 (2달 주기)
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const nextEven = (Math.floor(month/2)*2) + 2;
        let meeting1Name = `${year}년 ${nextEven}월 정기모임`;
        let meeting2Name = `${year}년 ${nextEven+2}월 정기모임`;
        if(nextEven+2 > 12) meeting2Name = `${year+1}년 ${(nextEven+2)-12}월 정기모임`;
        meetings = [
            { id: "meet_1", name: meeting1Name, feeAmount: 30000, membersStatus: generateEmptyStatus() },
            { id: "meet_2", name: meeting2Name, feeAmount: 30000, membersStatus: generateEmptyStatus() }
        ];
        saveToLocalStorage();
    }

    // 랜더링 테이블
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if(!currentMeetingObj) {
            tbody.innerHTML = '<tr><td colspan="6">모임을 선택해주세요</td></tr>';
            return;
        }
        const statusList = currentMeetingObj.membersStatus;
        const feeAmt = currentMeetingObj.feeAmount || 30000;
        document.getElementById('feeAmountInput').value = feeAmt;
        let html = '';
        members.forEach((member, idx) => {
            const st = statusList[idx] || { attendance: false, feePaid: false, etc: "" };
            const checkedAttend = st.attendance ? 'checked' : '';
            const checkedFee = st.feePaid ? 'checked' : '';
            const etcVal = st.etc || '';
            html += `<tr>
                        <td style="text-align:center">${member.id}</td>
                        <td class="member-name">${member.name}</td>
                        <td class="phone">${member.phone}</td>
                        <td class="checkbox-cell"><input type="checkbox" class="attend-cb" data-idx="${idx}" ${checkedAttend}></td>
                        <td class="checkbox-cell"><input type="checkbox" class="fee-cb" data-idx="${idx}" ${checkedFee}></td>
                        <td><input type="text" class="etc-input" data-idx="${idx}" value="${escapeHtml(etcVal)}" placeholder="메모"></td>
                     </tr>`;
        });
        tbody.innerHTML = html;
        attachTableEvents();
        updateStatistics();
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function attachTableEvents() {
        document.querySelectorAll('.attend-cb').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                if(currentMeetingObj && currentMeetingObj.membersStatus[idx]) {
                    currentMeetingObj.membersStatus[idx].attendance = e.target.checked;
                    updateStatistics();
                }
            });
        });
        document.querySelectorAll('.fee-cb').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                if(currentMeetingObj && currentMeetingObj.membersStatus[idx]) {
                    currentMeetingObj.membersStatus[idx].feePaid = e.target.checked;
                    updateStatistics();
                }
            });
        });
        document.querySelectorAll('.etc-input').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                if(currentMeetingObj && currentMeetingObj.membersStatus[idx]) {
                    currentMeetingObj.membersStatus[idx].etc = e.target.value;
                }
            });
        });
    }

    function updateStatistics() {
        if(!currentMeetingObj) return;
        const status = currentMeetingObj.membersStatus;
        const attendCnt = status.filter(s => s.attendance === true).length;
        const paidCnt = status.filter(s => s.feePaid === true).length;
        const feeAmt = currentMeetingObj.feeAmount || 30000;
        const totalSum = paidCnt * feeAmt;
        document.getElementById('attendCount').innerText = attendCnt;
        document.getElementById('paidCount').innerText = paidCnt;
        document.getElementById('totalFeeSum').innerText = totalSum.toLocaleString();
        document.getElementById('totalMemberCount').innerText = members.length;
    }

    function updateMeetingSelect() {
        const select = document.getElementById('meetingSelect');
        select.innerHTML = '';
        meetings.forEach(meet => {
            const option = document.createElement('option');
            option.value = meet.id;
            option.textContent = `${meet.name} (회비 ${meet.feeAmount?.toLocaleString() || 30000}원)`;
            if(currentMeetingId === meet.id) option.selected = true;
            select.appendChild(option);
        });
    }

    function loadMeetingById(meetingId) {
        const found = meetings.find(m => m.id === meetingId);
        if(found) {
            currentMeetingId = found.id;
            currentMeetingObj = found;
            // 동기화 fee 입력창
            document.getElementById('feeAmountInput').value = found.feeAmount || 30000;
            renderTable();
            updateMeetingSelect();
        } else if(meetings.length > 0) {
            currentMeetingId = meetings[0].id;
            currentMeetingObj = meetings[0];
            renderTable();
            updateMeetingSelect();
        } else {
            currentMeetingObj = null;
            renderTable();
        }
    }

    // 현재 UI 상태를 currentMeetingObj에 동기화 (저장 전)
    function syncUItoMeeting() {
        if(!currentMeetingObj) return;
        const rows = document.querySelectorAll('#tableBody tr');
        if(rows.length === 0) return;
        const statusList = currentMeetingObj.membersStatus;
        for(let i=0; i<members.length; i++) {
            const attendCb = document.querySelector(`.attend-cb[data-idx="${i}"]`);
            const feeCb = document.querySelector(`.fee-cb[data-idx="${i}"]`);
            const etcInput = document.querySelector(`.etc-input[data-idx="${i}"]`);
            if(attendCb && statusList[i]) statusList[i].attendance = attendCb.checked;
            if(feeCb && statusList[i]) statusList[i].feePaid = feeCb.checked;
            if(etcInput && statusList[i]) statusList[i].etc = etcInput.value;
        }
        // fee amount 동기화
        const newFee = parseInt(document.getElementById('feeAmountInput').value);
        if(!isNaN(newFee) && newFee > 0) currentMeetingObj.feeAmount = newFee;
    }

    function saveCurrentMeeting() {
        if(!currentMeetingObj) {
            alert('저장할 모임이 없습니다. 새 모임을 만드세요.');
            return;
        }
        syncUItoMeeting();
        // meetings 배열 업데이트
        const index = meetings.findIndex(m => m.id === currentMeetingObj.id);
        if(index !== -1) meetings[index] = currentMeetingObj;
        else meetings.push(currentMeetingObj);
        saveToLocalStorage();
        updateMeetingSelect();
        alert(`✅ "${currentMeetingObj.name}" 모임이 저장되었습니다.`);
        updateStatistics();
    }

    function createNewMeeting() {
        let name = prompt("모임 이름 (예: 2026년 6월 정기모임)", `${new Date().getFullYear()}년 ${new Date().getMonth()+2}월 모임`);
        if(!name) name = `새 모임 ${new Date().toLocaleDateString()}`;
        const fee = parseInt(document.getElementById('feeAmountInput').value);
        const newId = "meet_" + Date.now();
        const newMeeting = {
            id: newId,
            name: name,
            feeAmount: isNaN(fee) ? 30000 : fee,
            membersStatus: generateEmptyStatus()
        };
        meetings.push(newMeeting);
        saveToLocalStorage();
        currentMeetingId = newId;
        currentMeetingObj = newMeeting;
        renderTable();
        updateMeetingSelect();
        alert(`새 모임 "${name}" 생성됨`);
    }

    function deleteCurrentMeeting() {
        if(!currentMeetingObj) return;
        if(meetings.length <= 1) {
            alert("최소 하나의 모임은 유지해야 합니다. 삭제 대신 초기화를 고려하세요.");
            return;
        }
        if(confirm(`"${currentMeetingObj.name}" 모임을 정말 삭제하시겠습니까?`)) {
            const newMeetings = meetings.filter(m => m.id !== currentMeetingObj.id);
            meetings = newMeetings;
            saveToLocalStorage();
            currentMeetingId = meetings[0]?.id || null;
            currentMeetingObj = meetings[0] || null;
            renderTable();
            updateMeetingSelect();
            if(currentMeetingObj) updateStatistics();
        }
    }

    function copyFromPreviousMeeting() {
        if(!currentMeetingObj) return;
        if(meetings.length < 2) {
            alert("복사할 이전 모임이 존재하지 않습니다.");
            return;
        }
        const prevMeetingId = [...meetings].reverse().find(m => m.id !== currentMeetingObj.id);
        if(!prevMeetingId) return;
        const prevMeeting = meetings.find(m => m.id === prevMeetingId.id);
        if(prevMeeting && confirm(`"${prevMeeting.name}" 의 참석/회비/기타 데이터를 현재 모임으로 복사하시겠습니까? (회비 금액은 유지)`)) {
            const newStatus = JSON.parse(JSON.stringify(prevMeeting.membersStatus));
            currentMeetingObj.membersStatus = newStatus;
            renderTable();
            saveCurrentMeeting();
            alert("복사 완료! 저장 버튼을 눌러 반영되었습니다.");
        }
    }

    // 마크 편의
    function markAllAttend(value) {
        if(!currentMeetingObj) return;
        currentMeetingObj.membersStatus.forEach(s => s.attendance = value);
        renderTable();
    }
    function markAllPaid(value) {
        if(!currentMeetingObj) return;
        currentMeetingObj.membersStatus.forEach(s => s.feePaid = value);
        renderTable();
    }

    function exportToCSV() {
        if(!currentMeetingObj) { alert("모임을 먼저 선택하세요"); return; }
        syncUItoMeeting();
        const rows = [["번호","이름","연락처","참석여부","회비납부","기타메모"]];
        members.forEach((m, idx) => {
            const st = currentMeetingObj.membersStatus[idx];
            rows.push([
                m.id, m.name, m.phone,
                st.attendance ? "참석" : "불참",
                st.feePaid ? "납부" : "미납",
                st.etc || ""
            ]);
        });
        const csvContent = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csvContent], {type: "text/csv;charset=utf-8;"});
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute("download", `${currentMeetingObj.name}_참석현황.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // 이벤트 등록 및 초기화
    function init() {
        loadFromLocalStorage();
        if(meetings.length === 0) {
            meetings.push({ id: "default", name: "첫 모임", feeAmount: 30000, membersStatus: generateEmptyStatus() });
            saveToLocalStorage();
        }
        currentMeetingId = meetings[0].id;
        currentMeetingObj = meetings[0];
        renderTable();
        updateMeetingSelect();

        document.getElementById('loadMeetingBtn').addEventListener('click', () => {
            const selId = document.getElementById('meetingSelect').value;
            const found = meetings.find(m => m.id === selId);
            if(found) {
                if(currentMeetingObj) syncUItoMeeting(); // 미리 변경사항 저장 안함, 경고.
                currentMeetingId = found.id;
                currentMeetingObj = found;
                renderTable();
                updateMeetingSelect();
            } else { alert("모임을 찾을 수 없음"); }
        });
        document.getElementById('saveMeetingBtn').addEventListener('click', saveCurrentMeeting);
        document.getElementById('newMeetingBtn').addEventListener('click', createNewMeeting);
        document.getElementById('deleteMeetingBtn').addEventListener('click', deleteCurrentMeeting);
        document.getElementById('copyPrevBtn').addEventListener('click', copyFromPreviousMeeting);
        document.getElementById('markAllAttendBtn').addEventListener('click', () => markAllAttend(true));
        document.getElementById('clearAllAttendBtn').addEventListener('click', () => markAllAttend(false));
        document.getElementById('markAllPaidBtn').addEventListener('click', () => markAllPaid(true));
        document.getElementById('clearAllPaidBtn').addEventListener('click', () => markAllPaid(false));
        document.getElementById('exportCSVBtn').addEventListener('click', exportToCSV);
        document.getElementById('feeAmountInput').addEventListener('change', () => {
            if(currentMeetingObj) {
                const newVal = parseInt(document.getElementById('feeAmountInput').value);
                if(!isNaN(newVal) && newVal>0) currentMeetingObj.feeAmount = newVal;
                updateStatistics();
            }
        });
    }

    init();
</script>
</body>
</html>
